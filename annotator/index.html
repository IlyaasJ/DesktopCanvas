<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Annotator</title>
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
    <canvas id="c"></canvas>
    <div id="badge">PASS</div>

    <div id="ui">
	<div id="notch">▾</div>
	<div id="toolbar" class="hidden">
	    <div id="colors">
		<button class="color" data-color="#000000" style="background:#000000"></button>
		<button class="color" data-color="#FFFFFF" style="background:#FFFFFF"></button>
		<button class="color" data-color="#f7e705" style="background:#f7e705"></button>
		<button class="color" data-color="#e30000" style="background:#e30000"></button>
		<button class="color" data-color="#0004e3" style="background:#0004e3"></button>

		<!-- 8th: color wheel -->
		<button id="wheel" class="color" data-color="#ffffff"></button>
		<input type="color" id="wheel-input" value="#ffffff">
	    </div>

	    
	    <div id="tools">
		<button id="erase">erase</button>
		<button id="pen">pen</button>
		<button id="clear">Clear</button>
		<button id="undo">Undo</button>
		<button id="redo">Redo</button>
		<button id="shape"></button>
		<button id="trace"></button>
		<button id="arrow"></button>
		<button id="save">Save</button>
		<button id="quit">Quit</button>
	    </div>

	    <div id="size-control">
		<input type="range" id="pen-size" min="1" max="100" value="20">
		<span id="size-label"></span>
	    </div>
	</div>
    </div>

  <script src="renderer.js"></script>
</body>
</html>
