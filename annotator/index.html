<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Annotator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="badge">DRAW</div>

  <div id="ui">
    <div id="notch">▾</div>
    <div id="toolbar" class="hidden">
      <button class="color" data-color="#ff3b30" style="background:#ff3b30"></button>
      <button class="color" data-color="#34c759" style="background:#34c759"></button>
      <button class="color" data-color="#0a84ff" style="background:#0a84ff"></button>
      <button class="color" data-color="#ffd60a" style="background:#ffd60a"></button>
      <button id="eraser">Eraser</button>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="clear">Clear</button>
      <button id="mode">Draw / Pass</button>
      <button id="quit">Quit</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
